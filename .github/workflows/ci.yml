name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor `engines` declares; 24 is Active LTS. 20 reached
        # end-of-life in April 2026.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # No wallet key reaches this job, and test/setup.ts fails any test that
      # reaches for the network, so a run here cannot spend a verification.
      - run: npm test

      # dist/ is gitignored and built by prepublishOnly, so this is the only
      # proof the published tarball can be produced from what is committed.
      - run: npm run build

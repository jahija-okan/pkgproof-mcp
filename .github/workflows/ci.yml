name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Style and types do not vary by runtime, so they are answered once rather
  # than once per version in the matrix below.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor `engines` declares and the oldest release still
        # receiving patches; 24 is Active LTS. 20 is deliberately absent: it
        # reached end-of-life in April 2026 and this package should not be
        # testing, let alone advertising, an unpatched runtime.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: it installs the lockfile exactly and
      # fails when the lockfile and package.json disagree.
      - run: npm ci

      # No wallet key reaches this job, and test/setup.ts fails any test that
      # reaches for the network, so a run here can never spend a verification.
      - run: npm test

      # dist/ is gitignored and built by prepublishOnly, so this is the only
      # proof that the published tarball can be produced from what is committed.
      - run: npm run build

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Mints the OIDC token npm exchanges for publish rights. No NPM_TOKEN: this
  # package uses trusted publishing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # npm needs 11.5.1+ for OIDC; Node 24 ships past that.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Check the tag matches the version being published
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # The tag is not trusted to have been tested.
      - run: npm run lint
      - run: npm test

      # npm answers a publish it has only queued, so a version can be accepted
      # here and served minutes later. Re-running this workflow after that lands
      # would fail on `npm publish` with "cannot publish over the previously
      # published version" and skip `registry` and `bundle` with it, leaving no
      # way to reach them short of burning the next version number.
      - name: Check whether the registry already serves this version
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          if [ "$(npm view --prefer-online "${name}@${version}" version 2>/dev/null || true)" = "${version}" ]; then
            echo "already=true" >>"${GITHUB_OUTPUT}"
            echo "${name}@${version} is already on the registry; skipping the publish"
          else
            echo "already=false" >>"${GITHUB_OUTPUT}"
          fi

      # --provenance signs the tarball against this commit and this run.
      # prepublishOnly builds dist/ first.
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public

      # The run that published 0.1.0 signed a provenance statement and then
      # failed to publish at all, and 0.1.5 did the same. npm's own answer to a
      # publish is that it "may take a few minutes to become available", so the
      # wait here is measured in minutes; the six five-second attempts this
      # replaces could not outlast the latency they existed to absorb.
      #
      # --prefer-online on every read: npm serves cached metadata otherwise, and
      # a loop polling its own cached 404 would wait out the full budget and
      # still miss a version that had landed.
      - name: Confirm the registry serves the tagged version, with provenance
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          for attempt in $(seq 1 40); do
            published="$(npm view --prefer-online "${name}@${version}" version 2>/dev/null || true)"

            if [ "${published}" = "${version}" ]; then
              attestations="$(npm view --prefer-online "${name}@${version}" dist.attestations 2>/dev/null || true)"
              if [ -z "${attestations}" ]; then
                echo "${name}@${version} published without a provenance attestation" >&2
                exit 1
              fi
              echo "${name}@${version} is live, with provenance"
              exit 0
            fi

            echo "attempt ${attempt}/40: registry has '${published:-nothing}', waiting"
            sleep 15
          done

          echo "registry never served ${name}@${version} within 10 minutes" >&2
          exit 1

  # Separate from `publish` so it cannot start before the npm package it names
  # exists: server.json points at @pkgproof/mcp at this exact version.
  registry:
    needs: publish
    runs-on: ubuntu-latest

    # The DNS key authenticates all of net.pkgproof/*, so it belongs in a secret
    # on this environment rather than on the repository. Declaring `environment:`
    # is what allows that; it protects nothing on its own.
    environment: mcp-registry-publish

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Pinned to a release and to its bytes. The release signs artifacts with a
      # sigstore bundle rather than an in-toto attestation, so a digest is the
      # check that needs no extra tooling.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      # DNS, not github-oidc: OIDC grants io.github.<owner>/*, and this server is
      # net.pkgproof/pkgproof, verified by the TXT record on pkgproof.net.
      - name: Authenticate to the MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain pkgproof.net --private-key "$MCP_PRIVATE_KEY"

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish

      - name: Confirm the registry serves this version as latest
        run: |
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"

          for attempt in 1 2 3 4 5 6; do
            latest="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=pkgproof" \
              | jq -r --arg name "${name}" '
                  .servers[]
                  | select(._meta["io.modelcontextprotocol.registry/official"].isLatest)
                  | select(.server.name == $name)
                  | .server.version
                ')"

            if [ "${latest}" = "${version}" ]; then
              echo "${name}@${version} is the latest version in the MCP Registry"
              exit 0
            fi

            echo "attempt ${attempt}: registry has '${latest:-nothing}', waiting"
            sleep 5
          done

          echo "registry never served ${name}@${version} as latest" >&2
          exit 1

  # The bundle Claude Desktop installs and Smithery distributes. Built from the
  # tagged source rather than the npm tarball, and attached to the GitHub release
  # because neither surface hosts a file for you.
  bundle:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run mcpb

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" mcpb/pkgproof-*.mcpb --clobber

name: Publish

# Tagged, not on push: publishing is a decision, and the tag is where it is made.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Mints the OIDC token npm exchanges for publish rights. No NPM_TOKEN: this
  # package is published by trusted publishing, so there is no long-lived
  # credential to steal.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # npm needs 11.5.1+ for OIDC; Node 24 ships well past that.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # asked for. A test already ties package.json to server.json and
      # SERVER_VERSION, so checking the tag here ties the whole chain together.
      - name: Check the tag matches the version being published
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # The tag is not trusted to have been tested. A red build here is a
      # release that does not happen.
      - run: npm run lint
      - run: npm test

      # --provenance signs the tarball against this commit and this run, which is
      # the claim `repository_provenance` looks for in everything else.
      # prepublishOnly builds dist/ first.
      - run: npm publish --provenance --access public

      # A publish that half-succeeds must not report green: the run that
      # published 0.1.0 signed a provenance statement and then failed to
      # publish at all. The registry can lag a publish by a few seconds, so
      # this waits on it rather than racing it.
      - name: Confirm the registry serves the tagged version, with provenance
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "${name}@${version}" version 2>/dev/null || true)"

            if [ "${published}" = "${version}" ]; then
              attestations="$(npm view "${name}@${version}" dist.attestations 2>/dev/null || true)"
              if [ -z "${attestations}" ]; then
                echo "${name}@${version} published without a provenance attestation" >&2
                exit 1
              fi
              echo "${name}@${version} is live, with provenance"
              exit 0
            fi

            echo "attempt ${attempt}: registry has '${published:-nothing}', waiting"
            sleep 5
          done

          echo "registry never served ${name}@${version}" >&2
          exit 1
